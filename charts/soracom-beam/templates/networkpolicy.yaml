{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "soracom-beam.fullname" . }}
# MongoDB: only the server may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-mongodb
  labels:
    {{- include "soracom-beam.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "soracom-beam.selector" (list . "mongodb") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "soracom-beam.selector" (list . "server") | nindent 14 }}
      ports:
        - port: 27017
---
# Server: the ingest port is open (the tunnel connector may run in another
# namespace); the unauthenticated query API only accepts Grafana.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "soracom-beam.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "soracom-beam.selector" (list . "server") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
    {{- if .Values.grafana.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "soracom-beam.selector" (list . "grafana") | nindent 14 }}
      ports:
        - port: 8081
    {{- end }}
{{- end }}
