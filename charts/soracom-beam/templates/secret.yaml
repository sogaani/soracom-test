{{- if not .Values.existingSecret }}
{{- if and (not .Values.server.beam.signatureKey) (not .Values.server.beam.allowUnsigned) }}
{{- fail "server.beam.signatureKey is required (or set server.beam.allowUnsigned=true): the ingest endpoint is public" }}
{{- end }}
{{- $name := include "soracom-beam.fullname" . }}
{{- /* Reuse generated passwords on upgrade. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $get := dict }}
{{- range $key := list "mongodb-root-password" "mongodb-password" "grafana-admin-password" }}
{{- $_ := set $get $key (get $existing $key | b64dec | default (randAlphaNum 32)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "soracom-beam.labels" . | nindent 4 }}
  annotations:
    # Generated passwords must survive `helm uninstall` while the MongoDB
    # volume (initialized with them) still exists.
    helm.sh/resource-policy: keep
type: Opaque
data:
  mongodb-root-password: {{ index $get "mongodb-root-password" | b64enc | quote }}
  mongodb-password: {{ index $get "mongodb-password" | b64enc | quote }}
  grafana-admin-password: {{ index $get "grafana-admin-password" | b64enc | quote }}
  beam-signature-key: {{ .Values.server.beam.signatureKey | b64enc | quote }}
{{- end }}
